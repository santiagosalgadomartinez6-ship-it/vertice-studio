services:
  - type: web
    name: vertice-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: VERTICE_SECRET_KEY
        generateValue: true
      - key: VERTICE_ADMIN_PASSWORD
        value: vertice2026
