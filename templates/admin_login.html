{% extends "base.html" %}
{% block title %}Admin — Vértice Studio{% endblock %}

{% block content %}
<section class="admin-login">
  <form method="post" class="form-reserva form-reserva--angosta">
    <h1 class="section__title">Acceso administrador</h1>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required autofocus>
    <button type="submit" class="btn btn--primary">Entrar</button>
  </form>
</section>
{% endblock %}
